# InstaBox 机器定时重启：应对免费版「连续运行 8 小时强制暂停」
#
# 2026-10-28 改：实测手动 suspend→resume 只要几秒、没有冷却，并且会把
# 8 小时计时从 resume 那一刻重新算（pm2 进程保留）。所以每天 07:40 和 19:40
# (北京时间) 主动暂停再恢复一次，让机器带满 8 小时撑过 08:30 / 20:30 推送。
# 选 :40 是为了避开 GitHub 整点排队延迟。
# 只有跑满 8 小时被强停才会冷却（默认 10 分钟），本流程会等冷却结束再恢复。
#
# 需要仓库 Secrets：INSTABOX_API_KEY、INSTABOX_MACHINE_ID
# 注意：GitHub 定时任务在仓库 60 天无提交后会自动停用，收到邮件提醒去点重新启用

name: Instabox Resume

on:
  schedule:
    - cron: '40 23 * * *'   # 07:40 北京时间
    - cron: '40 11 * * *'   # 19:40 北京时间
  workflow_dispatch:

jobs:
  restart:
    runs-on: ubuntu-latest
    steps:
      - name: Suspend then resume (reset 8h timer)
        env:
          IB_KEY: ${{ secrets.INSTABOX_API_KEY }}
          IB_MACHINE: ${{ secrets.INSTABOX_MACHINE_ID }}
        run: |
          set -e
          if [ -z "$IB_KEY" ] || [ -z "$IB_MACHINE" ]; then
            echo "::error::缺少 INSTABOX_API_KEY 或 INSTABOX_MACHINE_ID secret"
            exit 1
          fi
          API="https://api.instabox.sh/v1/machines/$IB_MACHINE"
          idem() { cat /proc/sys/kernel/random/uuid; }
          info() { curl -sS -H "X-API-Key: $IB_KEY" "$API"; }
          state() { info | jq -r '.state // "unknown"'; }

          S=$(state); echo "当前状态: $S"
          info | jq -c '{state,runStartedAt,cooldownUntil}' || true

          if [ "$S" = "running" ]; then
            echo "发送 suspend..."
            curl -sS -X POST "$API/suspend" -H "X-API-Key: $IB_KEY" -H "Idempotency-Key: $(idem)" | head -c 1000; echo
            for i in $(seq 1 24); do
              sleep 5; S=$(state); echo "  $S"
              case "$S" in suspended|paused|stopped*) break;; esac
            done
          fi

          # 发 resume；遇到冷却 (409 machine_cooldown) 就按 Retry-After 等待后重试
          for attempt in 1 2 3 4 5 6; do
            OUT=$(curl -sS -w "\n%{http_code}" -X POST "$API/resume" -H "X-API-Key: $IB_KEY" -H "Idempotency-Key: $(idem)")
            CODE=$(echo "$OUT" | tail -n1); BODY=$(echo "$OUT" | sed '$d')
            echo "resume HTTP $CODE: $(echo "$BODY" | head -c 500)"
            if [ "$CODE" -lt 300 ]; then break; fi
            WAIT=$(echo "$BODY" | jq -r '.error.retryAfterSeconds // 60' 2>/dev/null || echo 60)
            [ "$WAIT" -gt 900 ] && WAIT=900
            echo "等待 ${WAIT}s 后重试"; sleep "$WAIT"
          done

          for i in $(seq 1 24); do
            sleep 5; S=$(state); echo "  $S"
            [ "$S" = "running" ] && break
          done
          info | jq -c '{state,runStartedAt,cooldownUntil,runtime}'
          if [ "$S" != "running" ]; then echo "::error::机器未恢复运行"; exit 1; fi
          echo "✅ 已重启，8 小时计时已重置"
