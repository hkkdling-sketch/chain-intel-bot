# InstaBox 机器续命：破「连续运行 8 小时自动暂停」的免费限制
#
# 为什么需要：免费计划连续运行 8 小时后会被强制暂停，而 UptimeRobot 的 ping
# 未必能戳醒「因运行超时」而暂停的机器（官方文档只写了能唤醒「闲置暂停」）。
# 这个 workflow 每 4 小时调一次 resume API，机器在跑就无事发生，被暂停了就拉起来。
#
# 配置（只需两步）：
#   1. 仓库 Settings → Secrets and variables → Actions 新建：
#        INSTABOX_API_KEY   = 控制台「API密钥」页生成的 key
#        INSTABOX_MACHINE_ID = 机器 ID（m_ 开头）
#   2. Actions 页 → Instabox Resume → Run workflow 手动验证一次
#
# 注意：GitHub 定时任务在仓库 60 天无提交后会自动停用，收到邮件提醒去点重新启用

name: Instabox Resume

on:
  schedule:
    # 每 4 小时整点（UTC），免费档 8 小时上限，留足余量
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  resume:
    runs-on: ubuntu-latest
    steps:
      - name: Resume machine if paused
        env:
          IB_KEY: ${{ secrets.INSTABOX_API_KEY }}
          IB_MACHINE: ${{ secrets.INSTABOX_MACHINE_ID }}
        run: |
          set -e
          if [ -z "$IB_KEY" ] || [ -z "$IB_MACHINE" ]; then
            echo "::error::缺少 INSTABOX_API_KEY 或 INSTABOX_MACHINE_ID secret"
            exit 1
          fi

          echo "查询机器状态..."
          RESP=$(curl -sS -w "\n%{http_code}" \
            -H "X-API-Key: $IB_KEY" \
            "https://api.instabox.sh/v1/machines/$IB_MACHINE")
          CODE=$(echo "$RESP" | tail -n1)
          BODY=$(echo "$RESP" | sed '$d')
          echo "HTTP $CODE"
          echo "$BODY" | head -c 2000
          echo

          STATE=$(echo "$BODY" | jq -r '.state // .machine.state // "unknown"' 2>/dev/null || echo unknown)
          echo "state = $STATE"

          case "$STATE" in
            running|starting|resuming)
              echo "✅ 机器在线，无需操作"
              ;;
            paused|pausing|stopped|stopped_*)
              echo "⏸ 机器已暂停，发送 resume..."
              curl -sS -X POST \
                "https://api.instabox.sh/v1/machines/$IB_MACHINE/resume" \
                -H "X-API-Key: $IB_KEY" \
                -H "Idempotency-Key: $(uuidgen)" | head -c 2000
              echo
              echo "已提交 resume 请求"
              ;;
            *)
              echo "⚠️ 未知状态 $STATE，尝试 resume 兜底"
              curl -sS -X POST \
                "https://api.instabox.sh/v1/machines/$IB_MACHINE/resume" \
                -H "X-API-Key: $IB_KEY" \
                -H "Idempotency-Key: $(uuidgen)" | head -c 2000
              ;;
          esac
